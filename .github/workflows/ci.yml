name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the zh sync check can diff origin/main...HEAD

      # Installs Vite+ (vp) globally, resolves the version from the project's
      # lockfile, sets up Node.js LTS, caches dependencies, and runs vp install.
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Install Playwright chromium
        run: vp exec -- playwright install chromium --with-deps

      - name: Enforce DECISIONS.zh.md sync
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^docs/DECISIONS\.md$'; then
            if ! git diff --name-only origin/main...HEAD | grep -q '^docs/DECISIONS\.zh\.md$'; then
              echo "::error::docs/DECISIONS.md changed but docs/DECISIONS.zh.md was not updated in the same commit."
              exit 1
            fi
          fi

      - name: Check (format + lint + typecheck)
        run: vp check

      - name: Test (browser mode, WebGPU + WebGL2)
        run: vp test

      - name: Build
        run: vp run build
